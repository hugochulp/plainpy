# Development config only: the plugin itself ships no Python package.
# The repo dogfoods the same Ruff rules plainpy enforces.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "W", "F", "I", "B", "UP", "SIM", "C4", "C90", "PL", "RET", "ARG",
  "ERA", "FBT001", "FBT002", "ANN", "BLE", "TRY", "PIE", "RUF", "PTH", "S",
]
ignore = ["TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 10
max-returns = 6
max-statements = 40

[tool.basedpyright]
# Hook scripts run as standalone scripts and import their siblings (`from _common import ...`).
extraPaths = ["scripts"]
